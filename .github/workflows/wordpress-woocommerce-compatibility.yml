name: WordPress and WooCommerce compatibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  runtime:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Previous baseline - WP 6.8 / PHP 8.2 / WC 10.7.0
            wordpress: 6.8
            php: '8.2'
            woocommerce: 10.7.0
          - label: Current - WP 7.1 / PHP 8.3 / WC 11.1.0
            wordpress: 7.1
            php: '8.3'
            woocommerce: 11.1.0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Install verified WP-CLI 2.12.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --output wp-cli.phar \
            https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          echo 'ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  wp-cli.phar' | sha256sum --check --strict

      - name: Create clean WooCommerce runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime=/tmp/egaline-runtime
          rm -rf "$runtime"
          php wp-cli.phar core download --path="$runtime" --version='${{ matrix.wordpress }}' --locale=en_US --force
          php wp-cli.phar config create --path="$runtime" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306
          php wp-cli.phar config set WP_DEBUG true --raw --path="$runtime"
          php wp-cli.phar config set WP_DEBUG_LOG true --raw --path="$runtime"
          php wp-cli.phar core install \
            --path="$runtime" \
            --url=http://egaline.test \
            --title='Egaline Runtime' \
            --admin_user=admin \
            --admin_password='runtime-only-password' \
            --admin_email=runtime@example.invalid \
            --skip-email
          php wp-cli.phar plugin install woocommerce \
            --path="$runtime" \
            --version='${{ matrix.woocommerce }}' \
            --activate
          rm -f "$runtime/wp-content/debug.log"
          ln -s "$GITHUB_WORKSPACE" "$runtime/wp-content/plugins/woocommerce-egaline-calculator"
          php wp-cli.phar plugin activate woocommerce-egaline-calculator --path="$runtime"
          php wp-cli.phar plugin status woocommerce-egaline-calculator --path="$runtime"
          php wp-cli.phar eval 'if (!class_exists("WooCommerce")) { fwrite(STDERR, "WooCommerce missing\n"); exit(1); } if (!class_exists("Webactueel\\EgalineCalculator\\EgalineCalculatorInit")) { fwrite(STDERR, "Plugin bootstrap missing\n"); exit(1); } echo "runtime-ok\n";' --path="$runtime"

      - name: Exercise WooCommerce initialization
        shell: bash
        run: |
          set -euo pipefail
          php wp-cli.phar eval 'do_action("before_woocommerce_init"); do_action("woocommerce_init"); echo "woocommerce-init-ok\n";' --path=/tmp/egaline-runtime

      - name: Reject runtime PHP errors
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log=/tmp/egaline-runtime/wp-content/debug.log
          if [[ -f "$log" ]] && grep -Eqi 'PHP (Fatal error|Parse error|Warning|Deprecated|Notice)' "$log"; then
            cat "$log"
            exit 1
          fi
